<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هزینه‌یار | ثبت و تحلیل هزینه‌های ماهانه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#f5f6fb;--surface:#fff;--ink:#141a3d;--muted:#5b6285;--navy:#1b2a7a;--accent:#e2552d;--line:#dde0ee;--chip:#e9ecf9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1330;--surface:#171c42;--ink:#eceefb;--muted:#a2a8cf;--navy:#9fb0ff;--accent:#ff8a63;--line:#2a3160;--chip:#222959}}
:root[data-theme="dark"]{--bg:#0f1330;--surface:#171c42;--ink:#eceefb;--muted:#a2a8cf;--navy:#9fb0ff;--accent:#ff8a63;--line:#2a3160;--chip:#222959}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.8}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 64px}
h1{margin:0;font-size:2.2rem;font-weight:900;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
h2{font-size:1.05rem;margin:0 0 14px;color:var(--navy)}
label{display:block;font-size:.88rem;color:var(--muted);margin-top:10px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 16px}
.primary{background:var(--navy);color:var(--bg);width:100%;margin-top:16px;font-weight:700}
.ghost{background:var(--chip)}
.total{font-size:2rem;font-weight:900;margin:0}
.total small{font-size:.9rem;font-weight:400;color:var(--muted)}
.bar{display:grid;grid-template-columns:90px 1fr 90px;gap:10px;align-items:center;font-size:.9rem;margin:8px 0}
.track{height:12px;background:var(--chip);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:6px}
ul{list-style:none;margin:0;padding:0}
li.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
li.row:last-child{border:0}
.meta{color:var(--muted);font-size:.85rem}
.del{background:none;color:var(--muted);padding:4px 8px}
.empty{text-align:center;color:var(--muted);padding:24px 0}
.right{display:flex;flex-direction:column;gap:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.top select{width:auto}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>هزینه‌یار</h1>
  <p class="sub">هزینه‌هات رو ثبت کن و ببین ماه به کجا رفته. اطلاعات فقط روی همین مرورگر ذخیره می‌شه.</p>
  <div class="grid">
    <div class="card">
      <h2>ثبت هزینه جدید</h2>
      <label for="amt">مبلغ (تومان)</label>
      <input id="amt" type="number" min="1" inputmode="numeric">
      <label for="cat">دسته‌بندی</label>
      <select id="cat"></select>
      <label for="note">توضیح (اختیاری)</label>
      <input id="note" type="text" maxlength="60">
      <label for="date">تاریخ</label>
      <input id="date" type="date">
      <p id="err" role="alert" class="meta" style="color:var(--accent);min-height:1.5em;margin:8px 0 0"></p>
      <button id="add" class="primary">ثبت هزینه</button>
    </div>
    <div class="right">
      <div class="card">
        <div class="top"><h2 style="margin:0">خلاصه ماه</h2><select id="month" aria-label="انتخاب ماه"></select></div>
        <p class="total"><span id="sum">۰</span> <small>تومان</small></p>
        <div id="bars"></div>
      </div>
      <div class="card">
        <h2>تراکنش‌ها</h2>
        <ul id="list"></ul>
        <div id="empty" class="empty" hidden>هنوز هزینه‌ای ثبت نشده. اولین هزینه را اضافه کن یا با داده نمونه امتحانش کن.<br><br><button id="seed" class="ghost">افزودن داده نمونه</button></div>
      </div>
    </div>
  </div>
</div>
<script>
const CATS=["خوراک","حمل‌ونقل","قبوض","تفریح","آموزش","سایر"];
const KEY="hazineyar:v1";
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat("fa-IR");
const jParts=new Intl.DateTimeFormat("en-u-ca-persian-nu-latn",{year:"numeric",month:"numeric"});
const jLabel=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{year:"numeric",month:"long"});
const jDay=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{day:"numeric",month:"long",year:"numeric"});
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){items=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
const d=iso=>new Date(iso+"T12:00:00");
function mkey(iso){const p=jParts.formatToParts(d(iso));const g=t=>p.find(x=>x.type===t).value;return g("year")+"-"+g("month").padStart(2,"0")}
const today=()=>{const t=new Date();return new Date(t.getTime()-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
CATS.forEach(c=>{const o=document.createElement("option");o.textContent=c;$("cat").append(o)});
$("date").value=today();
function render(){
  const keys=[...new Set([mkey(today()),...items.map(i=>mkey(i.date))])].sort().reverse();
  const cur=keys.includes($("month").value)?$("month").value:keys[0];
  $("month").replaceChildren(...keys.map(k=>{const o=document.createElement("option");o.value=k;const s=items.find(i=>mkey(i.date)===k);o.textContent=jLabel.format(d(s?s.date:today()));if(k===cur)o.selected=true;return o}));
  const mine=items.filter(i=>mkey(i.date)===cur).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const sum=mine.reduce((s,i)=>s+i.amount,0);
  $("sum").textContent=nf.format(sum);
  const by={};mine.forEach(i=>by[i.cat]=(by[i.cat]||0)+i.amount);
  const max=Math.max(0,...Object.values(by));
  $("bars").replaceChildren(...Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{
    const r=document.createElement("div");r.className="bar";
    const n=document.createElement("span");n.textContent=c;
    const t=document.createElement("div");t.className="track";
    const f=document.createElement("div");f.className="fill";f.style.width=(v/max*100)+"%";t.append(f);
    const a=document.createElement("span");a.textContent=nf.format(v);a.className="meta";
    r.append(n,t,a);return r}));
  $("list").replaceChildren(...mine.map(i=>{
    const li=document.createElement("li");li.className="row";
    const l=document.createElement("div");
    const t=document.createElement("strong");t.textContent=nf.format(i.amount)+" تومان";
    const m=document.createElement("div");m.className="meta";m.textContent=i.cat+(i.note?" | "+i.note:"")+" | "+jDay.format(d(i.date));
    l.append(t,m);
    const b=document.createElement("button");b.className="del";b.textContent="حذف";b.setAttribute("aria-label","حذف هزینه "+nf.format(i.amount));
    b.onclick=()=>{items=items.filter(x=>x.id!==i.id);save();render()};
    li.append(l,b);return li}));
  $("empty").hidden=items.length>0;
}
$("add").onclick=()=>{
  const amount=Math.round(Number($("amt").value));
  if(!(amount>0)){$("err").textContent="مبلغ را به‌صورت عدد مثبت وارد کن.";$("amt").focus();return}
  if(!$("date").value){$("err").textContent="تاریخ را انتخاب کن.";return}
  $("err").textContent="";
  items.push({id:Date.now(),amount,cat:$("cat").value,note:$("note").value.trim(),date:$("date").value});
  save();$("amt").value="";$("note").value="";$("month").value=mkey($("date").value);render();$("amt").focus();
};
$("month").onchange=render;
$("seed").onclick=()=>{
  const t=d(today());const mk=n=>{const x=new Date(t);x.setDate(x.getDate()-n);return new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
  [[185000,"خوراک","خرید هفتگی",1],[60000,"حمل‌ونقل","تاکسی",2],[420000,"قبوض","اینترنت",3],[250000,"تفریح","سینما",4],[900000,"آموزش","دوره آنلاین",5],[95000,"خوراک","ناهار بیرون",6]]
   .forEach(([amount,cat,note,n],k)=>items.push({id:Date.now()+k,amount,cat,note,date:mk(n)}));
  save();render();
};
render();
</script>
</body>
</html>
